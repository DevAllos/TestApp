name: Check Runner OS Versions

on:
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate OS Matrix
        id: set-matrix
        run: |
          # Menyusun JSON daftar runner resmi yang didukung GitHub
          JSON='{"os":["ubuntu-latest","ubuntu-24.04","ubuntu-22.04","windows-latest","windows-2025","windows-2022"]}'
          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  check-os:
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: 🐧 Cek Detail Linux
        if: runner.os == 'Linux'
        run: |
          OS_NAME=$(lsb_release -d | cut -f2 2>/dev/null || cat /etc/os-release | grep PRETTY_NAME | cut -d'"' -f2)
          KERNEL=$(uname -r)
          
          echo "### 🐧 Linux (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "- **OS:** $OS_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel:** $KERNEL" >> $GITHUB_STEP_SUMMARY

          echo "OS: $OS_NAME | Kernel: $KERNEL"

      - name: 🪟 Cek Detail Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          
          $summary = @"
          ### 🪟 Windows (${{ matrix.os }})
          - **OS:** $($os.Caption)
          - **Build:** $($os.BuildNumber)
          - **Arch:** $($os.OSArchitecture)
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "OS: $($os.Caption) | Build: $($os.BuildNumber)"
